<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ficha de cadastro — Le Care</title>
<style>
  :root{--vinho:#72243E;--bg:#F7F4F0;--tx:#2b2b2b;--bd:#ddd6ce}
  *{box-sizing:border-box;font-family:'Segoe UI',system-ui,-apple-system,sans-serif}
  body{margin:0;background:var(--bg);color:var(--tx)}
  .top{background:var(--vinho);color:#fff;padding:18px 16px;text-align:center;font-size:20px;font-weight:700;letter-spacing:.06em}
  .wrap{max-width:560px;margin:0 auto;padding:20px 14px 60px}
  .card{background:#fff;border:1px solid var(--bd);border-radius:14px;padding:22px 18px;box-shadow:0 2px 10px rgba(0,0,0,.05)}
  h1{font-size:18px;margin:0 0 4px;color:var(--vinho)} p.sub{margin:0 0 18px;font-size:13px;color:#666}
  label{display:block;font-size:12.5px;font-weight:600;margin:14px 0 4px} label .op{font-weight:400;color:#999}
  input,select{width:100%;padding:11px 12px;font-size:15px;border:1px solid var(--bd);border-radius:9px;background:#fff}
  input:focus,select:focus{outline:2px solid var(--vinho);border-color:var(--vinho)}
  .row{display:flex;gap:10px} .row>div{flex:1}
  button{width:100%;margin-top:22px;padding:13px;background:var(--vinho);color:#fff;border:0;border-radius:10px;font-size:16px;font-weight:600;cursor:pointer}
  button:disabled{opacity:.6;cursor:wait}
  .err{background:#FBEAEA;border:1px solid #E7B4B4;color:#8C2B2B;border-radius:9px;padding:10px 12px;font-size:13px;margin-top:14px;display:none}
  .okbox{text-align:center;padding:30px 10px} .okbox .big{font-size:44px} .hp{position:absolute;left:-9999px;opacity:0}
</style>
</head>
<body>
<div class="top">LE CARE</div>
<div class="wrap"><div class="card" id="card">
  <div class="okbox"><div class="big">⏳</div><p class="sub">Carregando a ficha…</p></div>
</div>
<p style="text-align:center;font-size:11px;color:#999;margin-top:16px">Le Care Manipulados · seus dados são usados apenas para o cadastro de cliente.</p>
</div>
<script>
(function(){
  var API='https://oubwotsfknurmhiqtroz.supabase.co/functions/v1/ficha-cadastro';
  var tok=new URLSearchParams(location.search).get('t')||'';
  var card=document.getElementById('card');
  function tela(icone,tit,txt){ card.innerHTML='<div class="okbox"><div class="big">'+icone+'</div><h1>'+tit+'</h1><p class="sub">'+txt+'</p></div>'; }
  if(!tok||tok.length<20){ tela('⚠','Link inválido','Peça um novo link na conversa do WhatsApp.'); return; }
  var esc=function(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); };
  function form(nomePre,telPre){
    card.innerHTML=
      '<h1>Ficha de cadastro</h1>'+
      '<p class="sub">Preencha os dados abaixo para concluirmos o seu cadastro. Leva menos de 2 minutos.</p>'+
      '<form id="f" autocomplete="on">'+
      '<input class="hp" type="text" name="site" tabindex="-1" autocomplete="off">'+
      '<label>Nome completo ou Razão Social *</label>'+
      '<input name="nome" required maxlength="140" value="'+esc(nomePre)+'" placeholder="Ex.: Clínica Exemplo LTDA">'+
      '<label>CPF ou CNPJ *</label>'+
      '<input name="doc" required maxlength="20" placeholder="000.000.000-00 ou 00.000.000/0000-00">'+
      '<div class="row"><div>'+
      '<label>Conselho profissional <span class="op">(se houver)</span></label>'+
      '<select name="conselho"><option value="">—</option><option>CRM</option><option>CRO</option><option>CRF</option><option>CRBM</option><option>COREN</option><option>CRFa</option><option>Outro</option></select>'+
      '</div><div>'+
      '<label>Número / UF <span class="op">(se houver)</span></label>'+
      '<input name="conselhoNum" maxlength="30" placeholder="Ex.: 12345 / PR">'+
      '</div></div>'+
      '<label>WhatsApp *</label>'+
      '<input name="telefone" required maxlength="20" value="'+esc(telPre)+'" placeholder="(00) 00000-0000">'+
      '<label>E-mail <span class="op">(opcional)</span></label>'+
      '<input name="email" type="email" maxlength="140" placeholder="voce@exemplo.com">'+
      '<label>Endereço completo <span class="op">(rua, número, bairro)</span></label>'+
      '<input name="endereco" maxlength="200" placeholder="Rua Exemplo, 100 - Centro">'+
      '<div class="row"><div>'+
      '<label>Cidade / UF</label>'+
      '<input name="cidade" maxlength="80" placeholder="Cidade - UF">'+
      '</div><div>'+
      '<label>CEP</label>'+
      '<input name="cep" maxlength="12" placeholder="00000-000">'+
      '</div></div>'+
      '<div class="err" id="err"></div>'+
      '<button type="submit" id="btn">Enviar ficha</button>'+
      '</form>';
    document.getElementById('f').addEventListener('submit', function(ev){
      ev.preventDefault();
      var fd=new FormData(ev.target), body={};
      fd.forEach(function(v,k){ body[k]=String(v); });
      var btn=document.getElementById('btn'), err=document.getElementById('err');
      btn.disabled=true; btn.textContent='Enviando…'; err.style.display='none';
      fetch(API+'?t='+encodeURIComponent(tok),{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(body)})
        .then(function(r){ return r.json().then(function(j){ return {s:r.status,j:j}; }); })
        .then(function(x){
          if(x.j&&x.j.ok&&!x.j.usado){ tela('✔','Ficha recebida!','Obrigado — seus dados chegaram à nossa equipe. Pode fechar esta página e voltar à conversa no WhatsApp.'); }
          else if(x.j&&x.j.usado){ tela('✔','Esta ficha já foi enviada','Já recebemos seus dados. Se precisar corrigir algo, fale com a gente na conversa do WhatsApp.'); }
          else { err.textContent=(x.j&&x.j.error)||'Não foi possível enviar — tente novamente.'; err.style.display='block'; btn.disabled=false; btn.textContent='Enviar ficha'; }
        })
        .catch(function(){ err.textContent='Falha de conexão — verifique a internet e tente novamente.'; err.style.display='block'; btn.disabled=false; btn.textContent='Enviar ficha'; });
    });
  }
  fetch(API+'?t='+encodeURIComponent(tok)+'&info=1')
    .then(function(r){ return r.json().then(function(j){ return {s:r.status,j:j}; }); })
    .then(function(x){
      if(x.s===404||!(x.j&&x.j.ok)){ tela('⚠','Link inválido ou expirado','Peça um novo link na conversa do WhatsApp.'); return; }
      if(x.j.status!=='pendente'){ tela('✔','Esta ficha já foi enviada','Já recebemos seus dados. Se precisar corrigir algo, fale com a gente na conversa do WhatsApp.'); return; }
      form(x.j.nomePre||'', x.j.telPre||'');
    })
    .catch(function(){ tela('⚠','Falha de conexão','Verifique a internet e recarregue a página.'); });
})();
</script>
</body>
</html>
